<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frayluz · Pantalla</title>
<link rel="icon" href="/assets/frayluz-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden;font-family:'Poppins',-apple-system,Segoe UI,Roboto,Arial,sans-serif}
  #stage{position:relative;width:100vw;height:100vh;background:#000}
  .slide{position:absolute;inset:0;opacity:0;transition:opacity .6s ease;background:#111}
  .slide.on{opacity:1}
  .slide img,.slide video{width:100%;height:100%;object-fit:cover}
  .logo-zone{position:absolute;inset:0;padding:3vh 3vw;display:flex;z-index:3;pointer-events:none}
  .slide .logo-badge{position:static;inset:auto;width:calc(9vh * var(--lscale,1));height:calc(9vh * var(--lscale,1));object-fit:contain;filter:drop-shadow(0 3px 10px rgba(0,0,0,.4))}
  .tag-zone{position:absolute;inset:0;padding:3vh 3vw;display:flex;z-index:3}
  .tag{border-radius:2.2vh;text-align:center;padding:calc(2vh * var(--tscale,1)) calc(1.4vw * var(--tscale,1));box-shadow:0 6px 24px rgba(0,0,0,.25);max-width:92%}
  .tag small{display:block;font-size:calc(2.4vh * var(--tscale,1));line-height:1.2;font-weight:500}
  .tag b{font-size:calc(5vh * var(--tscale,1));font-weight:700;line-height:1.15;font-family:'Quicksand',sans-serif}
  #empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2vh;color:#caa;background:#1a1a1a}
  #empty img{width:14vh;height:14vh;object-fit:contain;opacity:.9;background:#fff;border-radius:50%;padding:1.2vh}
  #empty p{font-size:2.4vh;margin:0;color:#e8c79a;font-family:'Quicksand',sans-serif;font-weight:600}
  #offline{position:fixed;top:2vh;right:2vh;background:rgba(0,0,0,.55);color:#fff;font-size:1.6vh;padding:.8vh 1.6vh;border-radius:1vh;z-index:9;display:none}
</style>
</head>
<body>
<div id="stage"></div>
<div id="empty" style="display:none">
  <img src="/assets/frayluz-logo.png" alt="Frayluz">
  <p id="empty-msg">Sin contenido todavía</p>
</div>
<div id="offline">Sin conexión con el panel, mostrando el último contenido guardado</div>
<script>
const parts = location.pathname.split('/').filter(Boolean);
const screenId = parts[1] || '1';
const stage = document.getElementById('stage');
const emptyBox = document.getElementById('empty');
const offlineBox = document.getElementById('offline');

let settings = { tagColor:'#E68C00', tagTextColor:'#3A0A0C', tagPosition:'bottom-center', tagSize:'md', logoPosition:'top-center', logoSize:'md' };
let items = [];
let signature = '';
let settingsSignature = '';
let currentIndex = 0;
let advanceTimer = null;
let slideEls = [];

const SIZE_SCALE = { sm: 0.8, md: 1, lg: 1.25, xl: 1.55 };
const ZONES = {
  'top-left':['flex-start','flex-start'], 'top-center':['flex-start','center'], 'top-right':['flex-start','flex-end'],
  'center-left':['center','flex-start'], 'center-center':['center','center'], 'center-right':['center','flex-end'],
  'bottom-left':['flex-end','flex-start'], 'bottom-center':['flex-end','center'], 'bottom-right':['flex-end','flex-end']
};

function normalizePosition(p, fallback){
  fallback = fallback || 'bottom-center';
  if(p === 'top') return 'top-center';
  if(p === 'bottom') return 'bottom-center';
  if(!p) return fallback;
  return ZONES[p] ? p : fallback;
}

function money(n){ return '$' + Math.round(Number(n)||0).toLocaleString('es-AR'); }

function tagHtml(item){
  const pos = normalizePosition(settings.tagPosition, 'bottom-center');
  const [ai, jc] = ZONES[pos];
  const scale = SIZE_SCALE[settings.tagSize] || 1;
  return `<div class="tag-zone" style="align-items:${ai};justify-content:${jc}">` +
    `<div class="tag" style="background:${settings.tagColor};color:${settings.tagTextColor};--tscale:${scale}">` +
    `<small>${escapeHtml(item.label)}</small><b>${money(item.price)}</b></div></div>`;
}

function logoHtml(){
  const pos = normalizePosition(settings.logoPosition, 'top-center');
  const [ai, jc] = ZONES[pos];
  const scale = SIZE_SCALE[settings.logoSize] || 1;
  return `<div class="logo-zone" style="align-items:${ai};justify-content:${jc}">` +
    `<img class="logo-badge" style="--lscale:${scale}" src="/assets/frayluz-logo.png" alt=""></div>`;
}

function buildSlides(){
  stage.innerHTML = '';
  slideEls = items.map((item, i) => {
    const el = document.createElement('div');
    el.className = 'slide' + (i === 0 ? ' on' : '');
    const media = item.type === 'video'
      ? `<video src="${item.file}" muted playsinline preload="auto"></video>`
      : `<img src="${item.file}" alt="">`;
    const logoPart = item.showLogo === false ? '' : logoHtml();
    const tagPart = item.showPrice === false ? '' : tagHtml(item);
    el.innerHTML = `${media}` + logoPart + tagPart;
    stage.appendChild(el);
    return el;
  });
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function clearTimer(){
  if(advanceTimer){ clearTimeout(advanceTimer); advanceTimer = null; }
}

function playSlide(i){
  clearTimer();
  if(!slideEls.length) return;
  slideEls.forEach((el, idx) => el.classList.toggle('on', idx === i));
  const item = items[i];
  const el = slideEls[i];

  if(item.type === 'video'){
    const vid = el.querySelector('video');
    vid.currentTime = 0;
    vid.muted = true;
    vid.play().catch(()=>{});
    vid.onended = () => goNext();
    const capSeconds = Number(item.seconds) || 0;
    advanceTimer = setTimeout(goNext, capSeconds > 0 ? capSeconds * 1000 : 5 * 60 * 1000);
  } else {
    const seconds = Math.max(3, Number(item.seconds) || 8);
    advanceTimer = setTimeout(goNext, seconds * 1000);
  }
}

function goNext(){
  if(!items.length) return;
  currentIndex = (currentIndex + 1) % items.length;
  playSlide(currentIndex);
}

async function pollData(){
  try{
    const res = await fetch('/api/data', { cache:'no-store' });
    if(!res.ok) throw new Error('bad status');
    const data = await res.json();
    offlineBox.style.display = 'none';
    settings = data.settings || settings;
    const newSettingsSignature = JSON.stringify(settings);
    const screen = data.screens[screenId];
    const newItems = (screen && screen.items) || [];
    const newSignature = JSON.stringify(newItems);
    const settingsChanged = newSettingsSignature !== settingsSignature;
    settingsSignature = newSettingsSignature;

    if(newSignature !== signature || (settingsChanged && items.length)){
      const keepIndex = newSignature === signature;
      signature = newSignature;
      items = newItems;
      if(!items.length){
        emptyBox.style.display = 'flex';
        stage.innerHTML = '';
        clearTimer();
        return;
      }
      emptyBox.style.display = 'none';
      currentIndex = keepIndex ? currentIndex : 0;
      buildSlides();
      playSlide(currentIndex);
    }
  }catch(e){
    offlineBox.style.display = 'block';
  }
}

pollData();
setInterval(pollData, 10000);

document.addEventListener('click', () => {
  document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(()=>{});
}, { once:true });
</script>
</body>
</html>
